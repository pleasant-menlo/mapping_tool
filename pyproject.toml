[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "mapping-tool"
dynamic = ["version"]
description = "Command line tool for generating skymaps for IMAP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "argparse>=1.4.0",
    "imap-l3-processing>=1.0.1",
    "imap-processing>=1.0.17",
    "jsonschema>=4.25.0",
    "pyyaml>=6.0.2",
    "hatchling",
    "uv-dynamic-versioning"

]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.uv.sources]
imap-l3-processing = { git = "https://github.com/IMAP-Science-Operations-Center/imap_L3_processing" }

[tool.setuptools]
py-modules = ["mapping_tool"]

